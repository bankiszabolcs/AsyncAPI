<p-toast position="bottom-right">
  <ng-template #headless let-msg let-closeFn="closeFn">
    <div
      class="flex items-start gap-3 px-4 py-3 rounded-xl shadow-lg
             bg-(--p-surface-card) border border-(--p-surface-border) min-w-72 max-w-sm"
      [class.cursor-pointer]="msg.data?.link"
      (click)="onToastClick(msg, closeFn, $event)"
    >
      <i class="pi pi-bell text-base text-(--p-primary-color) mt-0.5 shrink-0"></i>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-(--p-text-color) leading-snug">{{ msg.summary }}</p>
        @if (msg.detail) {
          <p class="text-xs text-(--p-text-muted-color) mt-0.5 line-clamp-2">{{ msg.detail }}</p>
        }
      </div>
      <button
        (click)="$event.stopPropagation(); closeFn($event)"
        class="shrink-0 p-1 rounded hover:bg-(--p-surface-hover) bg-transparent border-none cursor-pointer"
      >
        <i class="pi pi-times text-xs text-(--p-text-muted-color)"></i>
      </button>
    </div>
  </ng-template>
</p-toast>

@if (loading.isLoading()) {
  <p-progressbar mode="indeterminate" class="loading-bar" />
}

<div class="flex flex-col h-screen bg-(--p-surface-ground) text-(--p-text-color)">
  <app-navbar (sidebarToggle)="toggleSidebar()" />
  <div class="flex flex-1 overflow-hidden pt-14">
    <!-- Asztali nézet: helyben maradó menü (összecsukható) -->
    @if (!isMobile()) {
      <app-sidebar [collapsed]="sidebarCollapsed()" />
    }
    <main class="flex-1 overflow-y-auto overflow-x-hidden">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Mobil/tablet nézet: balról beúszó menü -->
@if (isMobile()) {
  <p-drawer [(visible)]="mobileSidebarOpen" position="left" styleClass="app-sidebar-drawer !w-64">
    <ng-template #header>
      <a routerLink="/" (click)="mobileSidebarOpen.set(false)" class="flex flex-1 items-center justify-center gap-2 no-underline select-none">
        <i class="pi pi-video text-2xl text-green-500"></i>
        <span class="text-lg font-bold tracking-tight text-(--p-text-color)">Clipo</span>
      </a>
    </ng-template>
    <app-sidebar [collapsed]="false" [drawerMode]="true" (itemClick)="mobileSidebarOpen.set(false)" />
  </p-drawer>
}
