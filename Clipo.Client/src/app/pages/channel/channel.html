<div class="max-w-5xl mx-auto p-6">

  <!-- Channel header -->
  <div class="flex items-center gap-5">
    <div class="w-24 h-24 rounded-full bg-(--p-surface-card) flex items-center justify-center shrink-0">
      <i class="pi pi-user text-4xl text-(--p-text-muted-color)"></i>
    </div>
    <div class="min-w-0">
      <h1 class="text-2xl font-bold text-(--p-text-color)">My Channel</h1>
      <p class="text-sm text-(--p-text-muted-color) mt-1">0 subscribers · 0 videos</p>
    </div>
  </div>

  <!-- Tabs (static placeholder) -->
  <div class="flex gap-6 mt-8 border-b border-(--p-surface-border) text-sm font-medium">
    <span class="pb-3 -mb-px border-b-2 border-(--p-primary-color) text-(--p-text-color)">Videos</span>

  <!-- Empty state -->
