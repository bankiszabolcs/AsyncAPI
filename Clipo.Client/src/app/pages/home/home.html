<div class="p-4">

  @if (videosResource.isLoading()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (_ of [1,2,3,4,5,6,7,8]; track $index) {
        <div class="flex flex-col gap-3">
          <p-skeleton height="160px" class="rounded-xl" />
          <div class="flex gap-3 px-1">
            <p-skeleton shape="circle" size="2.25rem" />
            <div class="flex flex-col gap-2 flex-1">
              <p-skeleton height="14px" />
              <p-skeleton height="14px" width="60%" />
            </div>
          </div>
        </div>
      }
    </div>
  } @else if (videosResource.error()) {
    <div class="flex flex-col items-center justify-center py-20 gap-3 text-(--p-text-muted-color)">
      <i class="pi pi-exclamation-circle text-4xl"></i>
      <p>Failed to load videos.</p>
    </div>
  } @else if (!videosResource.value()?.length) {
    <div class="flex flex-col items-center justify-center py-20 gap-3 text-(--p-text-muted-color)">
      <i class="pi pi-video text-4xl"></i>
      <p>No videos yet.</p>
    </div>
  } @else {
    <p-dataview [value]="videosResource.value()!" layout="grid">
      <ng-template #grid let-items>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 p-1">
          @for (video of items; track video.id) {
            <app-video-card [video]="video" />
          }
        </div>
      </ng-template>
    </p-dataview>
  }

</div>
