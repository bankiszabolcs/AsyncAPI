<div class="p-6">
  <h2 class="text-2xl font-bold mb-6 text-(--p-text-color)">Library</h2>

  <div class="p-4 rounded-xl bg-(--p-surface-card)">
    <p-tabs value="playlists">
    <p-tablist>
      <p-tab value="playlists" class="mr-4">
        <i class="pi pi-list mr-2"></i>Playlists
      </p-tab>
      <p-tab value="saved" class="mr-4">
        <i class="pi pi-bookmark mr-2"></i>Saved videos
      </p-tab>
      <p-tab value="watchlater">
        <i class="pi pi-clock mr-2"></i>Watch later
      </p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="playlists">
        <app-library-playlists />
      </p-tabpanel>

      <p-tabpanel value="saved">
        <app-library-saved-videos />
      </p-tabpanel>

      <p-tabpanel value="watchlater">
        <app-library-watch-later />
      </p-tabpanel>
    </p-tabpanels>
    </p-tabs>
  </div>
</div>
