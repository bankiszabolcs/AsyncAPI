<div class="max-w-6xl mx-auto p-6">

  <div class="flex items-center justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl font-bold text-(--p-text-color)">Studio</h1>
      <p class="text-sm text-(--p-text-muted-color) mt-1">Manage your content and track performance.</p>
    </div>
    <a
      routerLink="/upload"
      class="flex items-center gap-2 px-4 py-2 rounded-full no-underline
        bg-(--p-primary-color) text-(--p-primary-contrast-color) text-sm font-medium
        hover:opacity-90 transition-opacity"
    >
      <i class="pi pi-upload"></i>
      <span>Upload</span>
    </a>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-8">
    @for (stat of stats; track stat.label) {
      <div class="p-5 rounded-xl bg-(--p-surface-card)">
        <div class="flex items-center gap-3 text-(--p-text-muted-color)">
          <i class="pi {{ stat.icon }} text-lg"></i>
          <span class="text-sm">{{ stat.label }}</span>
        </div>
        <p class="text-3xl font-bold text-(--p-text-color) mt-3">{{ stat.value }}</p>
      </div>
    }
  </div>

  <!-- Content table placeholder -->
  <h2 class="text-lg font-semibold text-(--p-text-color) mt-10 mb-4">Your videos</h2>
  <div class="flex flex-col items-center justify-center text-center gap-3 py-16 rounded-xl bg-(--p-surface-card)">
    <i class="pi pi-inbox text-5xl text-(--p-text-muted-color)"></i>
    <p class="text-(--p-text-color) font-medium">Nothing here yet</p>
    <p class="text-sm text-(--p-text-muted-color)">Upload your first video to get started.</p>
  </div>

</div>
