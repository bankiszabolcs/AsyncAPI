<div class="relative w-full">

  <!-- Keresőmező -->
  <div class="flex items-center w-full gap-3 px-4 py-1.5 rounded-full
    bg-(--p-surface-card) border border-(--p-surface-border)
    focus-within:border-(--p-primary-color) transition-colors duration-150">
    <i class="pi pi-search shrink-0 text-(--p-text-muted-color) text-sm"></i>
    <input
      type="search"
      placeholder="Search..."
      autocomplete="off"
      class="flex-1 bg-transparent outline-none border-none text-sm
        text-(--p-text-color) placeholder:text-(--p-text-muted-color)"
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (focus)="onFocus()"
      (keydown.enter)="onEnter()"
    />
  </div>

  <!-- Legördülő panel: előzmények -->
  @if (showHistory) {
    <div class="absolute top-full left-0 right-0 mt-1 z-50 rounded-xl overflow-hidden
      bg-(--p-surface-card) border border-(--p-surface-border)
      shadow-[0_8px_24px_rgba(0,0,0,0.3)]">

      <div class="flex items-center justify-between px-4 py-2 border-b border-(--p-surface-border)">
        <span class="text-xs font-semibold text-(--p-text-muted-color) uppercase tracking-wide">History</span>
        <button
          type="button"
          class="text-xs text-(--p-primary-color) hover:underline bg-transparent border-none cursor-pointer px-0"
          (click)="clearHistory($event)"
        >Clear</button>
      </div>

      @for (item of history(); track item) {
        <button
          type="button"
          class="flex items-center gap-3 w-full px-4 py-2.5 text-left bg-transparent border-none
            text-(--p-text-color) hover:bg-(--p-surface-hover) cursor-pointer transition-colors duration-100"
          (click)="selectHistory(item)"
        >
          <i class="pi pi-history text-(--p-text-muted-color) text-sm shrink-0"></i>
          <span class="flex-1 text-sm truncate">{{ item }}</span>
          <i
            class="pi pi-times text-(--p-text-muted-color) text-xs shrink-0 p-1 rounded
              hover:bg-(--p-surface-border) transition-colors"
            (click)="removeHistoryItem(item, $event)"
          ></i>
        </button>
      }
    </div>
  }

  <!-- Legördülő panel: javaslatok -->
  @if (showSuggestions) {
    <div class="absolute top-full left-0 right-0 mt-1 z-50 rounded-xl overflow-hidden
      bg-(--p-surface-card) border border-(--p-surface-border)
      shadow-[0_8px_24px_rgba(0,0,0,0.3)]">

      @for (title of suggestions(); track title) {
        <button
          type="button"
          class="flex items-center gap-3 w-full px-4 py-2.5 text-left bg-transparent border-none
            text-(--p-text-color) hover:bg-(--p-surface-hover) cursor-pointer transition-colors duration-100"
          (click)="selectSuggestion(title)"
        >
          <i class="pi pi-search text-(--p-text-muted-color) text-sm shrink-0"></i>
          <span class="flex-1 text-sm truncate">{{ title }}</span>
        </button>
      }
    </div>
  }

</div>
