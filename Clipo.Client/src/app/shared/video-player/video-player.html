<div
  class="player-root relative w-full bg-black rounded-xl overflow-hidden select-none"
  (mousemove)="onMouseMove()"
  (click)="closeQualityMenu()"
>
  <video
    #videoEl
    class="w-full aspect-video block"
    [poster]="poster()"
    (click)="togglePlay()"
    (timeupdate)="onTimeUpdate($event)"
    (durationchange)="onDurationChange($event)"
    (progress)="onProgress($event)"
    (play)="onPlay()"
    (pause)="onPause()"
    (ended)="onEnded()"
  ></video>

  <!-- Play/pause overlay — a kör kattintható, a többi átengedi a klikket -->
  @if (!isPlaying()) {
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <div
        class="w-16 h-16 bg-black/50 rounded-full flex items-center justify-center backdrop-blur-sm
               pointer-events-auto cursor-pointer hover:bg-black/70 transition-colors"
        (click)="togglePlay()"
      >
        <i class="pi pi-play text-white text-2xl ml-1"></i>
      </div>
    </div>
  }

  <!-- Vezérlők -->
  <div
    class="absolute bottom-0 left-0 right-0 transition-opacity duration-300"
    [class.opacity-0]="!showControls()"
    [class.pointer-events-none]="!showControls()"
  >
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none"></div>

    <div class="relative px-4 pb-3 pt-10">

      <!-- Seek sáv -->
      <div class="group/seek relative mb-3">
        <div
          class="py-2 cursor-pointer"
          (click)="seek($event)"
          (mousemove)="onSeekHover($event)"
          (mouseleave)="onSeekLeave()"
        >
          <div class="relative h-1 group-hover/seek:h-1.5 transition-all duration-150 bg-white/25 rounded-full">
            <div class="absolute inset-y-0 left-0 bg-white/40 rounded-full transition-none" [style.width.%]="buffered()"></div>
            <div class="absolute inset-y-0 left-0 bg-red-500 rounded-full transition-none" [style.width.%]="progress()"></div>
            <div
              class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 bg-red-500 rounded-full
                     opacity-0 group-hover/seek:opacity-100 transition-opacity shadow-md"
              [style.left.%]="progress()"
            ></div>
          </div>
        </div>

        <!-- Sprite tooltip -->
        @if (spriteFrame(); as frame) {
          <div
            class="absolute bottom-full mb-2 pointer-events-none -translate-x-1/2"
            [style.left.%]="(hoverRatio() ?? 0) * 100"
          >
            <div
              class="rounded overflow-hidden border border-white/20 shadow-2xl"
              [style.width.px]="frame.w"
              [style.height.px]="frame.h"
              [style.background-image]="safeSpriteUrl()"
              [style.background-position]="'-' + frame.x + 'px -' + frame.y + 'px'"
              [style.background-size]="'auto'"
            ></div>
            <p class="text-center text-xs text-white mt-1 font-medium drop-shadow">{{ hoverTime() }}</p>
          </div>
        }
      </div>

      <!-- Alsó sor -->
      <div class="flex items-center gap-3 text-white">

        <!-- Play/Pause -->
        <button (click)="togglePlay()" class="hover:scale-110 transition-transform shrink-0">
          <i class="pi text-xl" [class.pi-play]="!isPlaying()" [class.pi-pause]="isPlaying()"></i>
        </button>

        <!-- Hangerő -->
        <button (click)="toggleMute()" class="hover:scale-110 transition-transform shrink-0">
          <i class="pi text-lg"
             [class.pi-volume-off]="isMuted() || volume() === 0"
             [class.pi-volume-down]="!isMuted() && volume() > 0 && volume() <= 0.5"
             [class.pi-volume-up]="!isMuted() && volume() > 0.5"
          ></i>
        </button>
        <input
          type="range" min="0" max="1" step="0.05"
          class="w-20 accent-red-500 cursor-pointer"
          [value]="isMuted() ? 0 : volume()"
          (input)="onVolumeChange($event)"
        />

        <!-- Idő -->
        <span class="text-sm tabular-nums shrink-0">
          {{ currentFormatted() }} / {{ durationFormatted() }}
        </span>

        <div class="flex-1"></div>

        <!-- Minőség választó -->
        @if (qualityLevels().length > 0) {
          <div class="relative shrink-0 flex items-center" (click)="$event.stopPropagation()">

            <!-- Dropdown -->
            @if (showQualityMenu()) {
              <div class="absolute bottom-full right-0 mb-2 bg-black/90 backdrop-blur-sm rounded-lg overflow-hidden py-1 min-w-20 border border-white/10 shadow-2xl">
                <!-- Auto -->
                <button
                  class="w-full px-4 py-1.5 text-sm text-left hover:bg-white/10 transition-colors flex items-center justify-between gap-3"
                  [class.text-red-400]="selectedLevel() === -1"
                  (click)="setLevel(-1)"
                >
                  Auto
                  @if (selectedLevel() === -1) {
                    <i class="pi pi-check text-xs"></i>
                  }
                </button>
                <!-- Minőség szintek -->
                @for (level of qualityLevels(); track level.index) {
                  <button
                    class="w-full px-4 py-1.5 text-sm text-left hover:bg-white/10 transition-colors flex items-center justify-between gap-3"
                    [class.text-red-400]="selectedLevel() === level.index"
                    (click)="setLevel(level.index)"
                  >
                    {{ level.label }}
                    @if (selectedLevel() === level.index) {
                      <i class="pi pi-check text-xs"></i>
                    }
                  </button>
                }
              </div>
            }

            <!-- Gomb -->
            <button
              class="text-sm font-medium px-2 py-0.5 rounded hover:bg-white/10 transition-colors tabular-nums leading-none"
              (click)="toggleQualityMenu($event)"
            >
              {{ qualityLabel() }}
              @if (selectedLevel() === -1 && playingLevel() >= 0) {
                <span class="text-white/50 text-xs ml-0.5">
                  ({{ qualityLevels().find(l => l.index === playingLevel())?.label }})
                </span>
              }
            </button>

          </div>
        }

        <!-- Teljes képernyő -->
        <button (click)="toggleFullscreen()" class="hover:scale-110 transition-transform shrink-0">
          <i class="pi text-lg"
             [class.pi-window-minimize]="isFullscreen()"
             [class.pi-window-maximize]="!isFullscreen()"
          ></i>
        </button>

      </div>
    </div>
  </div>
</div>
