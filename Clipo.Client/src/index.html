<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title>Clipo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function() {
      var t = localStorage.getItem('clipo_theme') || 'dark';
      document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
