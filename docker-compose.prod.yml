# Éles (production) konfiguráció — önálló fájl, nem override
# Futtatás: docker compose -f docker-compose.prod.yml up -d --build
#
# Első telepítés előtt:
#   cp .env.example .env && nano .env   (töltsd ki: DOMAIN=oracle_ip, jelszavak)
#
# Ha később domain + HTTPS lesz: keycloak command -> start --http-enabled=true,
# nginx -> nginx.prod.conf.template (HTTPS verzió), certbot service hozzáadása.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_started
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  app:
    build:
      context: ./AsyncApi
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - UploadDirectory=/tmp/uploads
      - Storage__Endpoint=minio:9000
      - Storage__AccessKey=${MINIO_ROOT_USER}
      - Storage__SecretKey=${MINIO_ROOT_PASSWORD}
      - Storage__PublicUrl=http://${DOMAIN}/storage
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Database__ConnectionString=Host=postgres;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Keycloak__Authority=http://keycloak:8180/auth/realms/clipo
      - Keycloak__ValidIssuer=http://${DOMAIN}/auth/realms/clipo
      - Cors__AllowedOrigin=http://${DOMAIN}
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      - AI__GeminiApiKey=${AI__GeminiApiKey}
    networks:
      - backend_net
    depends_on:
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

  minio:
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - backend_net
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - backend_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./Clipo.Client
      dockerfile: Dockerfile.prod
    volumes:
      - ./Clipo.Client/public/i18n:/usr/share/nginx/html/i18n:ro
    networks:
      - frontend_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${DB_USER}
      - KC_DB_PASSWORD=${DB_PASSWORD}
      - KC_HTTP_PORT=8180
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY_HEADERS=xforwarded
    networks:
      - backend_net
    volumes:
      - ./keycloak-themes/clipo:/opt/keycloak/themes/clipo:ro
    depends_on:
      postgres:
        condition: service_healthy

  postfix:
    image: boky/postfix:v5.1.0-alpine
    environment:
      - RELAYHOST=smtp-relay.brevo.com:587
      - RELAYHOST_USERNAME=${SMTP_USERNAME}
      - RELAYHOST_PASSWORD=${SMTP_PASSWORD}
      - POSTFIX_mynetworks=127.0.0.0/8 172.18.0.0/16
      - ALLOW_EMPTY_SENDER_DOMAINS=1
      - POSTFIX_smtpd_recipient_restrictions=permit_mynetworks,reject_non_fqdn_recipient,reject_unknown_recipient_domain,reject
      - POSTFIX_smtp_header_checks=regexp:/etc/postfix/header_checks
      - INET_INTERFACES=all
    networks:
      - backend_net
    volumes:
      - ./postfix/header_checks:/etc/postfix/header_checks:ro
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
    networks:
      - backend_net
    volumes:
      - seq_data:/data

volumes:
  minio_data:
  redis_data:
  postgres_data:
  seq_data:

networks:
  frontend_net:
  backend_net:
