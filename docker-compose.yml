services:
  app:
    build:
      context: ./AsyncApi
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - UploadDirectory=/tmp/uploads
      # Dockeron belül a MinIO service neve alapján éri el az appot
      - Storage__Endpoint=minio:9000
      # A publikus URL-t a böngésző használja, ezért localhost kell
      - Storage__PublicUrl=http://localhost:9000
      - Redis__ConnectionString=redis:6379
      - Database__ConnectionString=Host=postgres;Database=asyncapi;Username=postgres;Password=postgres
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    depends_on:
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

  minio:
    image: minio/minio
    ports:
      - "9000:9000"   # S3 API (az app és a böngésző is ezen ér el mindent)
      - "9001:9001"   # MinIO webes admin felület
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"   # helyi fejlesztéshez elérhető kívülről is
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # PONG választ vár; ha nem jön, unhealthy
      interval: 5s    # 5 másodpercenként ellenőrzi
      timeout: 3s     # 3 másodpercen belül kell válasz
      retries: 5      # 5 egymás utáni kudarc után unhealthy — az app nem indul el

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=asyncapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scriptek: első indulásnál (üres volume esetén) ábécé sorrendben lefutnak
      # 01_schema.sql → táblák, 02_pgmemento.sh → audit telepítés
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./Clipo.Client
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./Clipo.Client/src:/app/src   # hot reload: a src változásai azonnal érvényesülnek
    depends_on:
      - app

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data

volumes:
  minio_data:
  redis_data:
  postgres_data:
  seq_data:
