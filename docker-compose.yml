services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_started
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  app:
    build:
      context: ./AsyncApi
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - UploadDirectory=/tmp/uploads
      - Storage__Endpoint=minio:9000
      - Storage__PublicUrl=http://192.168.0.241/storage
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Database__ConnectionString=Host=postgres;Database=asyncapi;Username=postgres;Password=postgres
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      # JWKS letöltés: belső Docker hálózaton éri el a Keycloak-ot (/auth prefix-szel)
      - Keycloak__Authority=http://keycloak:8180/auth/realms/clipo
      # JWT iss claim: a publikus URL (nginx forwarded headerei alapján)
      - Keycloak__ValidIssuer=http://192.168.0.241/auth/realms/clipo
      # Gemini API kulcs — ha üres, a tag generálás ki van kapcsolva
      - AI__GeminiApiKey=${AI__GeminiApiKey}
    networks:
      - backend_net
    depends_on:
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

  minio:
    image: minio/minio
    ports:
      - "9001:9001"   # csak az admin felület érhető el kívülről
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - backend_net
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - backend_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"   # DB kliens eszközökhöz (DBeaver stb.)
    environment:
      - POSTGRES_DB=asyncapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - backend_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./Clipo.Client
      dockerfile: Dockerfile
    networks:
      - frontend_net
    volumes:
      - ./Clipo.Client/src:/app/src
      - ./Clipo.Client/public:/app/public
    depends_on:
      - app

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KC_HTTP_PORT=8180
      # Keycloak /auth úton szolgál (belül és kívül is) — egyezik az nginx /auth/ proxyval
      - KC_HTTP_RELATIVE_PATH=/auth
      # A publikus URL-t (issuer, redirect) az nginx X-Forwarded-* headereiből vezeti le
      - KC_PROXY_HEADERS=xforwarded
    networks:
      - backend_net
    volumes:
      - ./keycloak-themes/clipo:/opt/keycloak/themes/clipo:ro
    depends_on:
      postgres:
        condition: service_healthy

  postfix:
    image: boky/postfix:v5.1.0-alpine    # rögzített verzió, ne latest
    environment:
      # Brevo relay — credentialök .env-ből jönnek, soha nem kerülnek gitbe
      - RELAYHOST=smtp-relay.brevo.com:587
      - RELAYHOST_USERNAME=${SMTP_USERNAME}
      - RELAYHOST_PASSWORD=${SMTP_PASSWORD}
      # Csak a Docker belső hálózatról fogad el levelet (172.18.0.0/16)
      - POSTFIX_mynetworks=127.0.0.0/8 172.18.0.0/16
      # Bármely Docker-belső feladótól elfogad — a POSTFIX_mynetworks védi
      - ALLOW_EMPTY_SENDER_DOMAINS=1
      # permit_mynetworks ELŐRE kell, különben a check_sender_access blokkolja a relay-t
      - POSTFIX_smtpd_recipient_restrictions=permit_mynetworks,reject_non_fqdn_recipient,reject_unknown_recipient_domain,reject
      # Brevo link tracking kikapcsolása — különben a Keycloak linkek nem működnek
      - POSTFIX_smtp_header_checks=regexp:/etc/postfix/header_checks
      # Postfix csak belső interfészeken hallgat — kívülről nem elérhető
      - INET_INTERFACES=all
    networks:
      - backend_net
    volumes:
      - ./postfix/header_checks:/etc/postfix/header_checks:ro
    # Szándékosan nincs ports: — kívülről teljesen elérhetetlen,
    # csak a Docker hálózaton belüli service-ek érik el (postfix:25)
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "8081:80"   # csak a webes UI érhető el kívülről
    networks:
      - backend_net
    volumes:
      - seq_data:/data

volumes:
  minio_data:
  redis_data:
  postgres_data:
  seq_data:

networks:
  frontend_net:
  backend_net:
