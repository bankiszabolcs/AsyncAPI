services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_started
      minio:
        condition: service_started
      keycloak:
        condition: service_started

  app:
    build:
      context: ./AsyncApi
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - UploadDirectory=/tmp/uploads
      - Storage__Endpoint=minio:9000
      - Storage__PublicUrl=http://192.168.0.52/storage
      - Redis__ConnectionString=redis:6379
      - Database__ConnectionString=Host=postgres;Database=asyncapi;Username=postgres;Password=postgres
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
      # JWKS letöltés: belső Docker hálózaton éri el a Keycloak-ot (/auth prefix-szel)
      - Keycloak__Authority=http://keycloak:8180/auth/realms/clipo
      # JWT iss claim: a publikus URL (nginx forwarded headerei alapján)
      - Keycloak__ValidIssuer=http://localhost/auth/realms/clipo
    depends_on:
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

  minio:
    image: minio/minio
    ports:
      - "9001:9001"   # csak az admin felület érhető el kívülről
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"   # DB kliens eszközökhöz (DBeaver stb.)
    environment:
      - POSTGRES_DB=asyncapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./Clipo.Client
      dockerfile: Dockerfile
    volumes:
      - ./Clipo.Client/src:/app/src
    depends_on:
      - app

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KC_HTTP_PORT=8180
      # Keycloak /auth úton szolgál (belül és kívül is) — egyezik az nginx /auth/ proxyval
      - KC_HTTP_RELATIVE_PATH=/auth
      # A publikus URL-t (issuer, redirect) az nginx X-Forwarded-* headereiből vezeti le
      - KC_PROXY_HEADERS=xforwarded
    depends_on:
      postgres:
        condition: service_healthy

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "8081:80"   # csak a webes UI érhető el kívülről
    volumes:
      - seq_data:/data

volumes:
  minio_data:
  redis_data:
  postgres_data:
  seq_data:
